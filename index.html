<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Adventure 🇬🇧 v13</title>
    <style>
        :root { 
            --bg: #fdf6e3; 
            --p: #ff85a2; 
            --s: #4ecdc4; 
            --txt: #2d3436; 
        }

        /* Resets per a iPhone i estils generals */
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); 
            color: var(--txt); 
            margin: 0; 
            text-align: center; 
            user-select: none; 
        }

        button, input, select { -webkit-appearance: none; appearance: none; }

        #app { width: 100%; max-width: 600px; margin: auto; padding: 20px; }
        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        button { 
            background: var(--s); border: none; border-radius: 15px; 
            padding: 15px; color: white; font-weight: bold; cursor: pointer; 
            margin: 8px; width: 85%; box-shadow: 0 4px #3baea5; font-size: 1.1rem; 
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px #3baea5; }
        button.primary { background: var(--p); box-shadow: 0 4px #e06d8a; }
        button.save { background: #27ae60; box-shadow: 0 4px #1e8449; }

        input[type="text"] { padding: 15px; border-radius: 10px; border: 2px solid var(--s); width: 85%; font-size: 1.2rem; text-align: center; margin-bottom: 10px; }

        /* Apartat Repàs */
        .review-controls { background: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #ddd; }
        .review-list { text-align: left; background: white; border-radius: 15px; overflow: hidden; border: 1px solid #ddd; }
        .review-row { display: grid; grid-template-columns: 1fr auto 1.2fr auto auto; gap: 8px; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .review-row:nth-child(even) { background: #fafafa; }
        .review-row span { font-size: 0.9rem; font-weight: bold; }
        .review-row input { margin: 0; width: 100%; padding: 8px; font-size: 0.9rem; border-radius: 8px; border: 1px solid #ccc; text-align: center; }
        .btn-mini { width: 35px; height: 35px; padding: 0; margin: 0; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: none; }
        .status-icon { font-size: 1.2rem; width: 20px; text-align: center; }
        .eye-text { font-size: 0.8rem; color: var(--p); font-style: italic; display: none; margin-top: 5px; }

        /* Àlbum i Cromos */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; margin-top: 20px; }
        .sticker { 
            aspect-ratio: 1/1; background: white; border: 1px solid #ddd; 
            border-radius: 10px; display: flex; align-items: center; 
            justify-content: center; overflow: hidden; position: relative;
        }
        .sticker img { width: 100%; height: 100%; object-fit: cover; }
        
        .sticker.locked { 
            background-image: url('pokeball.png'); 
            background-size: cover; background-position: center;
            color: white; font-weight: bold; font-size: 1.2rem;
        }
        .sticker.locked::after {
            content: ""; position: absolute; width: 35px; height: 35px;
            background: rgba(0,0,0,0.4); border-radius: 50%; z-index: 0;
        }

        .admin-editing .sticker { cursor: pointer; border: 2px dashed var(--p); }

        .won-list { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 20px 0; }
        .sticker-won { 
            position: relative; width: 85px; aspect-ratio: 1/1; 
            background: white; border-radius: 10px; border: 2px solid var(--p); overflow: hidden; 
        }
        .sticker-won img { width: 100%; height: 100%; object-fit: cover; }
        .new-badge { 
            position: absolute; top: 0; left: 0; background: #ffe66d; color: #000; 
            font-size: 0.7rem; font-weight: bold; padding: 2px 6px; 
            border-bottom-right-radius: 8px; z-index: 2; box-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }

        .matching-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .match-card { 
            background: white; padding: 15px 5px; border: 2px solid #ddd; 
            border-radius: 12px; cursor: pointer; min-height: 55px; 
            display: flex; align-items: center; justify-content: center; font-weight: bold; 
        }
        .match-card.selected { border-color: var(--p); background: #fff0f3; }
        .match-card.correct { border-color: var(--s); background: #e8faf8; color: #ccc; }
    </style>
</head>
<body>

<div id="app">
    <div id="menu" class="screen active">
        <h1>🎁 English Adventure 🦄</h1>
        <button class="primary" onclick="startGame(1)">1. Traducció ✍️</button>
        <button class="primary" onclick="startGame(2)">2. Quiz 🤔</button>
        <button class="primary" onclick="startGame(3)">3. Escolta 🎧</button>
        <button class="primary" onclick="startGame(4)">4. Parelles 🔗</button>
        <button style="background-color: #9b59b6; box-shadow: 0 4px #8e44ad;" onclick="openReview()">📚 Repàs (Sense premis)</button>
        <hr style="margin:20px; border:0; border-top:1px dashed #ccc">
        <button onclick="goToScreen('config')">Configuració ⚙️</button>
        <button onclick="openAlbum()">El meu Àlbum 📸</button>
    </div>

    <div id="review" class="screen">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:15px">
            <button style="width:50px; padding:8px; margin:0" onclick="goToScreen('menu')">🏠</button>
            <h2 style="margin:0">📚 Repàs</h2>
            <div style="width:50px"></div>
        </div>

        <div class="review-controls">
            <select id="revCat" onchange="renderReview()" style="width:100%; padding:10px; border-radius:10px; margin-bottom:10px; font-weight:bold; border:2px solid var(--s)">
            </select>
            <label style="font-weight:bold; cursor:pointer">
                <input type="checkbox" id="revPrac" onchange="renderReview()" checked> Practicar (Escriure)
            </label>
        </div>

        <div class="review-list" id="revList"></div>
    </div>

    <div id="config" class="screen">
        <h2>Configuració ⚙️</h2>
        <p>Paraules per tema:</p>
        <select id="selLimit" style="padding:12px; font-size:1.2rem; width:80%; border-radius:10px;">
            <option value="1">1 paraula</option>
            <option value="2">2 paraules</option>
            <option value="3">3 paraules</option>
            <option value="5">5 paraules</option>
            <option value="8">8 paraules</option>
            <option value="12">12 paraules</option>
        </select>
        <br><br>
        <button class="save" onclick="saveConfig()">Guardar Canvis</button>
        <button onclick="goToScreen('menu')">Enrere</button>
    </div>

    <div id="game" class="screen">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:15px">
            <button style="width:50px; padding:8px; margin:0" onclick="goToScreen('menu')">🏠</button>
            <div id="prog" style="font-weight:bold">0/0</div>
            <div id="errs" style="color:#e06d8a; font-weight:bold">❌: 0</div>
        </div>
        <h2 id="mTitle"></h2>
        <div id="gCont"></div>
        <div id="fb" style="height:25px; margin:15px; font-weight:bold"></div>
    </div>

    <div id="album" class="screen">
        <h2 id="aTitle">El meu Àlbum 🏆</h2>
        <button id="btnSaveAdmin" class="save" style="display:none" onclick="exitAdmin()">💾 Guardar Canvis</button>
        <div id="stats" style="margin-bottom:10px; font-weight:bold"></div>
        <div class="gallery" id="gal"></div>
        <div id="aCtrl" style="margin-top:25px">
            <button class="primary" onclick="goToScreen('menu')">Inici 🏠</button>
            <br><br>
            <small style="color:#ccc; cursor:pointer" onclick="enterAdmin()">🔒 Admin Mode</small>
        </div>
    </div>
</div>

<script>
    const vocab = [
        { c: "COLORS", w: [{e:"red", k:"vermell"}, {e:"green", k:"verd"}, {e:"blue", k:"blau"}, {e:"yellow", k:"groc"}, {e:"orange", k:"taronja"}, {e:"purple", k:"lila"}, {e:"pink", k:"rosa"}, {e:"brown", k:"marró"}, {e:"black", k:"negre"}, {e:"white", k:"blanc"}]},
        { c: "NUMBERS", w: [{e:"one", k:"u"}, {e:"two", k:"dos"}, {e:"three", k:"tres"}, {e:"four", k:"quatre"}, {e:"five", k:"cinc"}, {e:"six", k:"sis"}, {e:"seven", k:"set"}, {e:"eight", k:"vuit"}, {e:"nine", k:"nou"}, {e:"ten", k:"deu"}]},
        { c: "DAYS", w: [{e:"monday", k:"dilluns"}, {e:"tuesday", k:"dimarts"}, {e:"wednesday", k:"dimecres"}, {e:"thursday", k:"dijous"}, {e:"friday", k:"divendres"}, {e:"saturday", k:"dissabte"}, {e:"sunday", k:"diumenge"}]},
        { c: "MONTHS", w: [{e:"january", k:"gener"}, {e:"february", k:"febrer"}, {e:"march", k:"març"}, {e:"april", k:"abril"}, {e:"may", k:"maig"}, {e:"june", k:"juny"}, {e:"july", k:"juliol"}, {e:"august", k:"agost"}, {e:"september", k:"setembre"}, {e:"october", k:"octubre"}, {e:"november", k:"novembre"}, {e:"december", k:"desembre"}]},
        { c: "WEATHER", w: [{e:"sunny", k:"assolellat"}, {e:"cloudy", k:"nuvolat"}, {e:"windy", k:"ventós"}, {e:"rainy", k:"plujós"}, {e:"cold", k:"fred"}, {e:"hot", k:"calor"}]},
        { c: "SCHOOL", w: [{e:"pencil", k:"llapis"}, {e:"pen", k:"bolígraf"}, {e:"rubber", k:"goma"}, {e:"ruler", k:"regle"}, {e:"book", k:"llibre"}, {e:"scissors", k:"tisores"}]}
    ];

    let unlocked = JSON.parse(localStorage.getItem('eng_v12_unl')) || [];
    let limit = parseInt(localStorage.getItem('eng_v12_lim')) || 2;
    let queue = [], curIdx = 0, mistakes = 0, isAdmin = false, mode = 0;
    let s1 = null, s2 = null, matches = 0;

    function goToScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'config') document.getElementById('selLimit').value = limit;
    }

    // --- LOGICA REPAS ---
    function openReview() {
        const sel = document.getElementById('revCat');
        sel.innerHTML = vocab.map(cat => `<option value="${cat.c}">${cat.c}</option>`).join('');
        renderReview();
        goToScreen('review');
    }

    function renderReview() {
        const catName = document.getElementById('revCat').value;
        const practiceOn = document.getElementById('revPrac').checked;
        const listCont = document.getElementById('revList');
        const data = vocab.find(v => v.c === catName).w;

        let html = "";
        data.forEach((item, index) => {
            html += `
            <div class="review-row">
                <span>${item.k}</span>
                <button class="btn-mini" onclick="speak('${item.e}')">🔊</button>
                <input type="text" 
                       id="inp${index}" 
                       placeholder="${practiceOn ? '?' : ''}" 
                       value="${practiceOn ? '' : item.e}" 
                       ${practiceOn ? '' : 'disabled'} 
                       oninput="checkLive(this, '${item.e}', 'st${index}')"
                       autocomplete="off" spellcheck="false">
                <div class="status-icon" id="st${index}"></div>
                <button class="btn-mini" style="background:#eee; color:black;" onclick="toggleEye('eye${index}')">👁️</button>
                <div class="eye-text" id="eye${index}" style="grid-column: 1 / span 5; margin-left: 10px;">${item.e}</div>
            </div>`;
        });
        listCont.innerHTML = html;
    }

    function checkLive(el, correct, statusId) {
        const val = el.value.toLowerCase().trim();
        const st = document.getElementById(statusId);
        if(val === "") { st.innerHTML = ""; el.style.borderColor = "#ccc"; return; }
        if(val === correct.toLowerCase()) {
            st.innerHTML = "✅";
            el.style.borderColor = "green";
        } else {
            st.innerHTML = "❌";
            el.style.borderColor = "red";
        }
    }

    function toggleEye(id) {
        const el = document.getElementById(id);
        el.style.display = (el.style.display === 'block') ? 'none' : 'block';
    }

    // --- LOGICA JOC ---
    function saveConfig() {
        limit = parseInt(document.getElementById('selLimit').value);
        localStorage.setItem('eng_v12_lim', limit);
        goToScreen('menu');
    }

    function startGame(m) {
        mode = m; queue = []; curIdx = 0; mistakes = 0; matches = 0;
        vocab.forEach(cat => {
            let shuf = [...cat.w].sort(() => 0.5 - Math.random());
            queue.push(...shuf.slice(0, Math.min(limit, shuf.length)));
        });
        if(m !== 4) queue.sort(() => 0.5 - Math.random());
        goToScreen('game');
        if(m === 4) drawMatch(); else drawQuest();
    }

    function drawQuest() {
        if(curIdx >= queue.length) return endG();
        const item = queue[curIdx];
        const cont = document.getElementById('gCont');
        document.getElementById('prog').innerText = `${curIdx+1} / ${queue.length}`;
        document.getElementById('errs').innerText = `❌: ${mistakes}`;
        document.getElementById('fb').innerHTML = "";
        
        let h = `<h3>"${item.k}"</h3>`;
        if(mode === 1) {
            h += `<input type="text" id="ai" autocomplete="off" spellcheck="false"><br><button class="primary" onclick="check(document.getElementById('ai').value)">Enviar</button>`;
        } else if(mode === 2) {
            let opts = [item.e];
            while(opts.length < 4) {
                let r = vocab[Math.floor(Math.random()*vocab.length)].w[Math.floor(Math.random()*vocab[0].w.length)].e;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => 0.5 - Math.random());
            opts.forEach(o => h += `<button onclick="check('${o}')">${o}</button>`);
        } else if(mode === 3) {
            h = `<button style="font-size:2.5rem; width:100px; height:100px; border-radius:50%" onclick="speak('${item.e}')">🔊</button><br><br><input type="text" id="ai" autocomplete="off" spellcheck="false"><br><button class="primary" onclick="check(document.getElementById('ai').value)">Comprovar</button>`;
            speak(item.e);
        }
        cont.innerHTML = h;
        if(document.getElementById('ai')) document.getElementById('ai').focus();
    }

    function check(u) {
        const it = queue[curIdx];
        if(u.toLowerCase().trim() === it.e.toLowerCase()) {
            document.getElementById('fb').innerHTML = "<span style='color:green'>✅ CORRECTE!</span>";
            setTimeout(() => { curIdx++; drawQuest(); }, 800);
        } else {
            mistakes++;
            document.getElementById('fb').innerHTML = `<span style='color:red'>❌ Era: ${it.e}</span>`;
            setTimeout(() => { curIdx++; drawQuest(); }, 1500);
        }
    }

    function drawMatch() {
        const cont = document.getElementById('gCont');
        document.getElementById('prog').innerText = `0 / ${queue.length}`;
        let ca = queue.map(i => ({t:i.k, id:i.e})).sort(() => 0.5-Math.random());
        let en = queue.map(i => ({t:i.e, id:i.e})).sort(() => 0.5-Math.random());
        let h = '<div class="matching-container"><div>';
        ca.forEach(w => h += `<div class="match-card" onclick="selM(this,'${w.id}','c')">${w.t}</div>`);
        h += '</div><div>';
        en.forEach(w => h += `<div class="match-card" onclick="selM(this,'${w.id}','e')">${w.t}</div>`);
        h += '</div></div>';
        cont.innerHTML = h;
    }

    function selM(el, id, ty) {
        if(el.classList.contains('correct')) return;
        if(ty==='c') { if(s1) s1.el.classList.remove('selected'); s1={el,id}; }
        else { if(s2) s2.el.classList.remove('selected'); s2={el,id}; }
        el.classList.add('selected');
        if(s1 && s2) {
            if(s1.id === s2.id) {
                s1.el.classList.add('correct'); s2.el.classList.add('correct');
                matches++; s1=null; s2=null;
                document.getElementById('prog').innerText = `${matches} / ${queue.length}`;
                if(matches === queue.length) setTimeout(endG, 800);
            } else {
                mistakes++; document.getElementById('errs').innerText = `❌: ${mistakes}`;
                let a=s1.el, b=s2.el;
                setTimeout(() => { a.classList.remove('selected'); b.classList.remove('selected'); }, 400);
                s1=null; s2=null;
            }
        }
    }

    function speak(t) { 
        const m = new SpeechSynthesisUtterance(t); 
        m.lang = 'en-GB'; m.rate = 0.9; window.speechSynthesis.speak(m); 
    }

    function endG() {
        const total = queue.length;
        const allowed = Math.floor(total / 6);
        let wonList = [];
        if (mistakes <= allowed) {
            let available = [];
            for (let i = 1; i <= 151; i++) { if (!unlocked.includes(i)) available.push(i); }
            if (available.length > 0) {
                let newId = available[Math.floor(Math.random() * available.length)];
                unlocked.push(newId);
                wonList.push({ id: newId, isNew: true });
            }
            if (mistakes === 0) {
                for (let i = 0; i < 2; i++) {
                    let rid = Math.floor(Math.random() * 151) + 1;
                    let isN = !unlocked.includes(rid);
                    if (isN) unlocked.push(rid);
                    wonList.push({ id: rid, isNew: isN });
                }
            }
        }
        localStorage.setItem('eng_v12_unl', JSON.stringify(unlocked));
        let h = `<h2>${mistakes <= allowed ? '🌟 Excel·lent!' : '☁️ Continua practicant'}</h2>`;
        h += `<p>Errors: ${mistakes} (Màxim: ${allowed})</p>`;
        if (wonList.length > 0) {
            h += `<div class="won-list">`;
            wonList.forEach(item => {
                let n = String(item.id).padStart(3, '0');
                h += `<div class="sticker-won">
                    ${item.isNew ? '<div class="new-badge">NEW</div>' : ''}
                    <img src="recompenses/${n}.png" onerror="this.src='data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMCIgaGVpZ2h0PSIxMCI+PHJlY3Qgd2lkdGg9IjEwIiBoZWlnaHQ9IjEwIiBmaWxsPSIjZGRkIi8+PC9zdmc+'">
                </div>`;
            });
            h += `</div>`;
        }
        h += `<button class="primary" onclick="openAlbum()">Veure Àlbum 📸</button>`;
        h += `<button onclick="goToScreen('menu')">Menú Principal 🏠</button>`;
        document.getElementById('gCont').innerHTML = h;
    }

    function openAlbum() { goToScreen('album'); drawAlb(); }
    function drawAlb() {
        const g = document.getElementById('gal'); g.innerHTML = "";
        document.getElementById('stats').innerText = `${unlocked.length} / 151 Cromos`;
        for(let i=1; i<=151; i++) {
            let isU = unlocked.includes(i);
            let d = document.createElement('div');
            d.className = `sticker ${isU?'':'locked'}`;
            d.onclick = () => { if(isAdmin) { if(isU) unlocked.splice(unlocked.indexOf(i),1); else unlocked.push(i); drawAlb(); } };
            if(isU) {
                let n = String(i).padStart(3, '0');
                d.innerHTML = `<img src="recompenses/${n}.png" onerror="this.parentElement.innerHTML='🖼️<br>${n}'">`;
            } else { d.innerHTML = `<span style="z-index:1; position:relative;">${i}</span>`; }
            g.appendChild(d);
        }
    }

    function enterAdmin() {
        if(prompt("Password:") === "Tercer2026") {
            isAdmin = true;
            document.getElementById('album').classList.add('admin-editing');
            document.getElementById('btnSaveAdmin').style.display = 'block';
            document.getElementById('aCtrl').style.display = 'none';
            document.getElementById('aTitle').innerText = "🔧 EDITANT";
            drawAlb();
        }
    }

    function exitAdmin() {
        isAdmin = false;
        localStorage.setItem('eng_v12_unl', JSON.stringify(unlocked));
        document.getElementById('album').classList.remove('admin-editing');
        document.getElementById('btnSaveAdmin').style.display = 'none';
        document.getElementById('aCtrl').style.display = 'block';
        document.getElementById('aTitle').innerText = "El meu Àlbum 🏆";
        drawAlb();
    }
</script>
</body>
</html>
