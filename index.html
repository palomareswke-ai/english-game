<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 English Adventure 🇬🇧 🦄</title>
    <style>
        :root {
            --bg-color: #fdf6e3;
            --primary-color: #ff85a2;
            --secondary-color: #4ecdc4;
            --accent-color: #ffe66d;
            --text-color: #2d3436;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        #app { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; text-align: center; }
        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        button {
            background-color: var(--secondary-color);
            border: none;
            border-radius: 20px;
            padding: 15px;
            font-size: 1.1rem;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin: 8px;
            box-shadow: 0 4px #3baea5;
            width: 85%;
            transition: all 0.1s;
        }

        button:active { transform: translateY(3px); box-shadow: 0 1px #3baea5; }
        button.primary { background-color: var(--primary-color); box-shadow: 0 4px #e06d8a; }
        button.save { background-color: #27ae60; box-shadow: 0 4px #1e8449; }

        .uk-flag { width: 35px; vertical-align: middle; margin: 0 8px; border-radius: 3px; }
        select { padding: 12px; border-radius: 10px; border: 2px solid var(--secondary-color); font-size: 1.1rem; width: 80%; margin: 20px 0; }
        input[type="text"] { padding: 15px; border-radius: 15px; border: 3px solid var(--secondary-color); font-size: 1.2rem; width: 80%; text-align: center; outline: none; margin-bottom: 10px; }

        /* Album */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; margin-top: 20px; }
        .sticker { aspect-ratio: 1/1; background: #fff; border-radius: 10px; display: flex; align-items: center; justify-content: center; border: 2px solid #ddd; overflow: hidden; font-size: 0.8rem; }
        .sticker img { width: 100%; height: 100%; object-fit: cover; }
        .sticker.locked { background: #eee; color: #bbb; }
        .admin-editing .sticker { cursor: pointer; border: 2px dashed var(--primary-color) !important; }

        /* Matching */
        .matching-container { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .match-card { background: white; padding: 15px 10px; border-radius: 12px; border: 3px solid #ddd; cursor: pointer; font-weight: bold; min-height: 55px; display: flex; align-items: center; justify-content: center; }
        .match-card.selected { border-color: var(--primary-color); background-color: #fff0f3; }
        .match-card.correct { border-color: var(--secondary-color); background-color: #e8faf8; color: #aaa; cursor: default; }
        .match-card.wrong { border-color: #ff6b6b; animation: shake 0.3s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .feedback-msg { font-size: 1.3rem; font-weight: bold; margin: 15px 0; min-height: 30px; }
    </style>
</head>
<body>

<div id="app">
    <div id="menu" class="screen active">
        <h1>🎁 English Adventure <img class="uk-flag" src="https://upload.wikimedia.org/wikipedia/commons/8/83/Flag_of_the_United_Kingdom_%283-5%29.svg" alt="UK"> 🦄</h1>
        <button class="primary" onclick="window.startGame(1)">1. Traducció ✍️</button>
        <button class="primary" onclick="window.startGame(2)">2. Quiz 🤔</button>
        <button class="primary" onclick="window.startGame(3)">3. Escolta 🎧</button>
        <button class="primary" onclick="window.startGame(4)">4. Parelles 🔗</button>
        <hr style="margin: 20px; border: 0; border-top: 2px dashed #ccc;">
        <button onclick="window.goToScreen('config')">Configuració ⚙️</button>
        <button onclick="window.openAlbum()">El meu Àlbum 📸</button>
    </div>

    <div id="config" class="screen">
        <h2>Configuració ⚙️</h2>
        <p>Paraules per cada tema:</p>
        <select id="words-per-cat">
            <option value="1">1 paraula</option>
            <option value="2">2 paraules</option>
            <option value="3">3 paraules</option>
            <option value="5">5 paraules</option>
            <option value="8">8 paraules</option>
            <option value="12">12 paraules</option>
        </select>
        <button class="save" onclick="window.saveConfig()">Guardar Canvis</button>
        <button onclick="window.goToScreen('menu')">Tornar</button>
    </div>

    <div id="game" class="screen">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <button style="width:50px; padding:5px; margin:0;" onclick="window.goToScreen('menu')">🏠</button>
            <div id="progress-text">0 / 0</div>
            <div id="lives-text">❌: 0</div>
        </div>
        <h2 id="mode-title"></h2>
        <div id="game-content"></div>
        <div id="feedback" class="feedback-msg"></div>
    </div>

    <div id="album" class="screen">
        <h2 id="album-title">Àlbum de Cromos 🏆</h2>
        <p id="stats-text"></p>
        <button id="save-admin-btn" style="display:none;" class="save" onclick="window.exitAdmin()">💾 Guardar Canvis</button>
        <div class="gallery" id="sticker-gallery"></div>
        <div id="album-controls" style="margin-top:20px;">
            <button class="primary" onclick="window.goToScreen('menu')">Inici 🏠</button>
            <br><br>
            <small style="color:#ccc; cursor:pointer" onclick="window.enterAdmin()">🔒 Admin</small>
        </div>
    </div>
</div>

<script>
    // VOCABULARI
    const vocabulary = [
        { cat: "COLORS", words: [{en:"red", ca:"vermell"}, {en:"orange", ca:"taronja"}, {en:"yellow", ca:"groc"}, {en:"green", ca:"verd"}, {en:"blue", ca:"blau"}, {en:"purple", ca:"lila"}, {en:"pink", ca:"rosa"}, {en:"brown", ca:"marró"}, {en:"white", ca:"blanc"}, {en:"black", ca:"negre"}]},
        { cat: "NUMBERS", words: [{en:"one", ca:"u"}, {en:"two", ca:"dos"}, {en:"three", ca:"tres"}, {en:"four", ca:"quatre"}, {en:"five", ca:"cinc"}, {en:"six", ca:"sis"}, {en:"seven", ca:"set"}, {en:"eight", ca:"vuit"}, {en:"nine", ca:"nou"}, {en:"ten", ca:"deu"}, {en:"eleven", ca:"onze"}, {en:"twelve", ca:"dotze"}, {en:"thirteen", ca:"tretze"}, {en:"fourteen", ca:"catorze"}, {en:"fifteen", ca:"quinze"}, {en:"sixteen", ca:"setze"}, {en:"seventeen", ca:"disset"}, {en:"eighteen", ca:"divuit"}, {en:"nineteen", ca:"dinou"}, {en:"twenty", ca:"vint"}]},
        { cat: "DAYS", words: [{en:"monday", ca:"dilluns"}, {en:"tuesday", ca:"dimarts"}, {en:"wednesday", ca:"dimecres"}, {en:"thursday", ca:"dijous"}, {en:"friday", ca:"divendres"}, {en:"saturday", ca:"dissabte"}, {en:"sunday", ca:"diumenge"}, {en:"weekend", ca:"cap de setmana"}]},
        { cat: "MONTHS", words: [{en:"january", ca:"gener"}, {en:"february", ca:"febrer"}, {en:"march", ca:"març"}, {en:"april", ca:"abril"}, {en:"may", ca:"maig"}, {en:"june", ca:"juny"}, {en:"july", ca:"juliol"}, {en:"august", ca:"agost"}, {en:"september", ca:"septembre"}, {en:"october", ca:"octubre"}, {en:"november", ca:"novembre"}, {en:"december", ca:"desembre"}]},
        { cat: "WEATHER", words: [{en:"sunny", ca:"assolellat"}, {en:"cloudy", ca:"nuvolat"}, {en:"windy", ca:"ventós"}, {en:"stormy", ca:"tempesta"}, {en:"rainy", ca:"plujós"}, {en:"snowy", ca:"neu"}, {en:"hot", ca:"calor"}, {en:"cold", ca:"fred"}]},
        { cat: "CLASSROOM", words: [{en:"pencil", ca:"llapis"}, {en:"pen", ca:"bolígraf"}, {en:"rubber", ca:"goma d'esborrar"}, {en:"pencil sharpener", ca:"maquineta"}, {en:"glue", ca:"barra d'enganxar"}, {en:"scissors", ca:"tisores"}, {en:"ruler", ca:"regle"}, {en:"coloured pencil", ca:"llapis de colors"}, {en:"markers", ca:"retoladors"}]}
    ];

    // ESTAT
    let unlocked = JSON.parse(localStorage.getItem('eng_adv_v11')) || [];
    let limit = parseInt(localStorage.getItem('eng_limit_v11')) || 2;
    let currentMode, gameQueue, currentIndex, errors, isAdmin = false;
    let sCat = null, sEng = null, mCount = 0;

    // FUNCIONS GLOBALS (window. per assegurar visibilitat)
    window.goToScreen = function(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        const target = document.getElementById(id);
        if(target) target.classList.add('active');
        if(id === 'config') document.getElementById('words-per-cat').value = limit;
    };

    window.saveConfig = function() {
        limit = parseInt(document.getElementById('words-per-cat').value);
        localStorage.setItem('eng_limit_v11', limit);
        window.goToScreen('menu');
    };

    window.startGame = function(mode) {
        currentMode = mode; gameQueue = []; currentIndex = 0; errors = 0; mCount = 0;
        vocabulary.forEach(v => {
            let shuf = [...v.words].sort(() => 0.5 - Math.random());
            let n = Math.min(limit, shuf.length);
            gameQueue.push(...shuf.slice(0, n));
        });
        if (mode !== 4) gameQueue.sort(() => 0.5 - Math.random());
        window.goToScreen('game');
        if (mode === 4) renderMatching(); else renderQuestion();
    };

    function renderQuestion() {
        if (currentIndex >= gameQueue.length) return finishGame();
        const item = gameQueue[currentIndex];
        const cont = document.getElementById('game-content');
        document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${gameQueue.length}`;
        document.getElementById('lives-text').innerText = `❌: ${errors}`;
        document.getElementById('feedback').innerHTML = "";
        
        let title = "";
        if(currentMode === 1) title = "Traducció ✍️";
        if(currentMode === 2) title = "Quiz 🤔";
        if(currentMode === 3) title = "Escolta 🎧";
        document.getElementById('mode-title').innerText = title;

        if (currentMode === 1) {
            cont.innerHTML = `<h3>"${item.ca}"</h3><input type="text" id="ansInp" autocomplete="off"><br><button class="primary" onclick="valAns(document.getElementById('ansInp').value)">Enviar</button>`;
            setTimeout(() => document.getElementById('ansInp').focus(), 100);
        } else if (currentMode === 2) {
            let o = [item.en];
            while(o.length < 4) {
                let r = vocabulary[Math.floor(Math.random()*6)].words[0].en;
                if(!o.includes(r)) o.push(r);
            }
            o.sort(() => 0.5 - Math.random());
            cont.innerHTML = `<h3>"${item.ca}"</h3>`;
            o.forEach(opt => {
                let b = document.createElement('button'); b.innerText = opt;
                b.onclick = () => valAns(opt); cont.appendChild(b);
            });
        } else if (currentMode === 3) {
            cont.innerHTML = `<button onclick="playWord()" style="font-size:2rem; width:80px;">🔊</button><br><input type="text" id="ansInp" autocomplete="off"><br><button class="primary" onclick="valAns(document.getElementById('ansInp').value)">Validar</button>`;
            playWord();
        }
    }

    window.valAns = function(u) {
        const it = gameQueue[currentIndex];
        const f = document.getElementById('feedback');
        if (u.toLowerCase().trim() === it.en.toLowerCase().trim()) {
            f.innerHTML = "<span style='color:green'>🌟 CORRECTE!</span>";
            setTimeout(() => { currentIndex++; renderQuestion(); }, 800);
        } else {
            errors++; f.innerHTML = `<span style='color:red'>❌ Era: ${it.en}</span>`;
            setTimeout(() => { currentIndex++; renderQuestion(); }, 1500);
        }
    };

    function renderMatching() {
        document.getElementById('mode-title').innerText = "Parelles 🔗";
        const cont = document.getElementById('game-content');
        document.getElementById('progress-text').innerText = `0 / ${gameQueue.length}`;
        let ca = gameQueue.map(i => ({t: i.ca, id: i.en})).sort(() => 0.5 - Math.random());
        let en = gameQueue.map(i => ({t: i.en, id: i.en})).sort(() => 0.5 - Math.random());
        cont.innerHTML = '<div class="matching-container"><div id="cCa"></div><div id="cEn"></div></div>';

            d.onclick = () => selM(d, w.id, 'ca'); document.getElementById('cCa').appendChild(d);
        });
