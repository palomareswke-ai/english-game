<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>English Adventure 🇬🇧</title>
    <style>
        :root { 
            --bg: #fdf6e3; 
            --p: #ff85a2; 
            --s: #4ecdc4; 
            --txt: #2d3436; 
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: var(--bg); color: var(--txt); margin: 0; text-align: center; user-select: none; 
        }

        #app { width: 100%; max-width: 600px; margin: auto; padding: 20px; }
        .screen { display: none; }
        .active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        button { 
            background: var(--s); border: none; border-radius: 15px; 
            padding: 15px; color: white; font-weight: bold; cursor: pointer; 
            margin: 8px; width: 85%; box-shadow: 0 4px #3baea5; font-size: 1.1rem; 
        }
        button:active { transform: translateY(2px); box-shadow: 0 2px #3baea5; }
        button.primary { background: var(--p); box-shadow: 0 4px #e06d8a; }
        button.save { background: #27ae60; box-shadow: 0 4px #1e8449; }

        input[type="text"] { padding: 15px; border-radius: 10px; border: 2px solid var(--s); width: 85%; font-size: 1.2rem; text-align: center; margin-bottom: 10px; }

        /* Apartat Repàs */
        .review-controls { background: white; padding: 15px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #ddd; }
        .review-list { text-align: left; background: white; border-radius: 15px; overflow: hidden; border: 1px solid #ddd; }
        .review-row { display: grid; grid-template-columns: 1fr auto 1.2fr auto auto; gap: 8px; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .review-row span { font-size: 0.9rem; font-weight: bold; }
        .btn-mini { width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1rem; box-shadow: none; margin:0; }

        /* Config Checkboxes */
        .cat-selector { text-align: left; background: white; padding: 15px; border-radius: 10px; border: 1px solid #ddd; margin: 15px auto; width: 85%; }
        .cat-option { display: flex; align-items: center; padding: 8px 0; font-weight: bold; cursor: pointer; border-bottom: 1px solid #eee; }
        .cat-option:last-child { border: none; }
        .cat-option input { width: 22px; height: 22px; margin-right: 12px; accent-color: var(--p); cursor: pointer; }

        /* Àlbum */
        .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; margin-top: 20px; }
        .sticker { aspect-ratio: 1/1; background: white; border: 1px solid #ddd; border-radius: 10px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .sticker.locked { background-image: url('pokeball.png'); background-size: cover; background-position: center; color: white; font-weight: bold; }
        .sticker img { width: 100%; height: 100%; object-fit: cover; }

        .matching-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .match-card { background: white; padding: 15px 5px; border: 2px solid #ddd; border-radius: 12px; cursor: pointer; min-height: 55px; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .match-card.selected { border-color: var(--p); background: #fff0f3; }
        .match-card.correct { border-color: var(--s); background: #e8faf8; color: #ccc; }
    </style>
</head>
<body>

<div id="app">
    <div id="menu" class="screen active">
        <h1>🎁 English Adventure 🦄</h1>
        <button class="primary" onclick="startGame(1)">1. Traducció ✍️</button>
        <button class="primary" onclick="startGame(2)">2. Quiz 🤔</button>
        <button class="primary" onclick="startGame(3)">3. Escolta 🎧</button>
        <button class="primary" onclick="startGame(4)">4. Parelles 🔗</button>
        <button style="background-color: #9b59b6; box-shadow: 0 4px #8e44ad;" onclick="openReview()">📚 Repàs (Sense premis)</button>
        <hr style="margin:20px; border:0; border-top:1px dashed #ccc">
        <button onclick="goToScreen('config')">Configuració ⚙️</button>
        <button onclick="openAlbum()">El meu Àlbum 📸</button>
    </div>

    <div id="review" class="screen">
        <button style="width:50px; float:left" onclick="goToScreen('menu')">🏠</button>
        <h2>📚 Repàs</h2>
        <div class="review-controls">
            <select id="revCat" onchange="renderReview()" style="width:100%; padding:10px; border-radius:10px; margin-bottom:10px; font-weight:bold; border:2px solid var(--s)"></select>
            <label><input type="checkbox" id="revPrac" onchange="renderReview()" checked> Practicar</label>
        </div>
        <div class="review-list" id="revList"></div>
    </div>

    <div id="config" class="screen">
        <h2>Configuració ⚙️</h2>
        <p><strong>Paraules per tema:</strong></p>
        <select id="selLimit" style="padding:12px; font-size:1.2rem; width:80%; border-radius:10px;">
            <option value="1">1 paraula</option>
            <option value="2">2 paraules</option>
            <option value="3">3 paraules</option>
            <option value="5">5 paraules</option>
            <option value="10">10 paraules</option>
            <option value="20">Totes</option>
        </select>

        <p style="margin-top:20px"><strong>Temes actius:</strong></p>
        <div id="catFilters" class="cat-selector"></div>

        <button class="save" onclick="saveConfig()">Guardar Canvis</button>
        <button onclick="goToScreen('menu')">Enrere</button>
    </div>

    <div id="game" class="screen">
        <div style="display:flex; justify-content: space-between; align-items:center; margin-bottom:15px">
            <button style="width:50px; padding:8px; margin:0" onclick="goToScreen('menu')">🏠</button>
            <div id="prog" style="font-weight:bold">0/0</div>
            <div id="errs" style="color:#e06d8a; font-weight:bold">❌: 0</div>
        </div>
        <div id="gCont"></div>
        <div id="fb" style="height:25px; margin:15px; font-weight:bold"></div>
    </div>

    <div id="album" class="screen">
        <h2 id="aTitle">El meu Àlbum 🏆</h2>
        <button id="btnSaveAdmin" class="save" style="display:none" onclick="exitAdmin()">💾 Guardar</button>
        <div id="stats" style="margin-bottom:10px; font-weight:bold"></div>
        <div class="gallery" id="gal"></div>
        <button class="primary" onclick="goToScreen('menu')">Inici 🏠</button>
        <br><br>
        <small style="color:#ccc; cursor:pointer" onclick="enterAdmin()">🔒 Admin</small>
    </div>
</div>

<script>
    const vocab = [
        { c: "COLORS", w: [{e:"red", k:"vermell"}, {e:"green", k:"verd"}, {e:"blue", k:"blau"}, {e:"yellow", k:"groc"}, {e:"orange", k:"taronja"}, {e:"purple", k:"lila"}, {e:"pink", k:"rosa"}, {e:"brown", k:"marró"}, {e:"black", k:"negre"}, {e:"white", k:"blanc"}]},
        { c: "NUMBERS", w: [
            {e:"one", k:"u"}, {e:"two", k:"dos"}, {e:"three", k:"tres"}, {e:"four", k:"quatre"}, {e:"five", k:"cinc"}, 
            {e:"six", k:"sis"}, {e:"seven", k:"set"}, {e:"eight", k:"vuit"}, {e:"nine", k:"nou"}, {e:"ten", k:"deu"},
            {e:"eleven", k:"onze"}, {e:"twelve", k:"dotze"}, {e:"thirteen", k:"tretze"}, {e:"fourteen", k:"catorze"}, {e:"fifteen", k:"quinze"}, 
            {e:"sixteen", k:"setze"}, {e:"seventeen", k:"disset"}, {e:"eighteen", k:"divuit"}, {e:"nineteen", k:"dinou"}, {e:"twenty", k:"vint"}
        ]},
        { c: "DAYS", w: [{e:"monday", k:"dilluns"}, {e:"tuesday", k:"dimarts"}, {e:"wednesday", k:"dimecres"}, {e:"thursday", k:"dijous"}, {e:"friday", k:"divendres"}, {e:"saturday", k:"dissabte"}, {e:"sunday", k:"diumenge"}]},
        { c: "MONTHS", w: [{e:"january", k:"gener"}, {e:"february", k:"febrer"}, {e:"march", k:"març"}, {e:"april", k:"abril"}, {e:"may", k:"maig"}, {e:"june", k:"juny"}, {e:"july", k:"juliol"}, {e:"august", k:"agost"}, {e:"september", k:"septembre"}, {e:"october", k:"octubre"}, {e:"november", k:"novembre"}, {e:"december", k:"desembre"}]},
        { c: "WEATHER", w: [{e:"sunny", k:"assolellat"}, {e:"cloudy", k:"nuvolat"}, {e:"windy", k:"ventós"}, {e:"rainy", k:"plujós"}, {e:"cold", k:"fred"}, {e:"hot", k:"calor"}]},
        { c: "SCHOOL", w: [{e:"pencil", k:"llapis"}, {e:"pen", k:"bolígraf"}, {e:"rubber", k:"goma"}, {e:"ruler", k:"regle"}, {e:"book", k:"llibre"}, {e:"scissors", k:"tisores"}]}
    ];

    let unlocked = JSON.parse(localStorage.getItem('eng_v12_unl')) || [];
    let limit = parseInt(localStorage.getItem('eng_v12_lim')) || 2;
    let activeCats = JSON.parse(localStorage.getItem('eng_v12_cats')) || vocab.map(v => v.c);
    
    let queue = [], curIdx = 0, mistakes = 0, isAdmin = false, mode = 0;
    let s1 = null, s2 = null, matches = 0;

    function goToScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'config') drawConfig();
    }

    function drawConfig() {
        document.getElementById('selLimit').value = limit;
        const cont = document.getElementById('catFilters');
        cont.innerHTML = vocab.map(cat => `
            <label class="cat-option">
                <input type="checkbox" class="cat-check" value="${cat.c}" ${activeCats.includes(cat.c) ? 'checked' : ''}>
                ${cat.c}
            </label>
        `).join('');
    }

    function saveConfig() {
        limit = parseInt(document.getElementById('selLimit').value);
        localStorage.setItem('eng_v12_lim', limit);
        
        const checks = document.querySelectorAll('.cat-check');
        activeCats = [];
        checks.forEach(chk => { if(chk.checked) activeCats.push(chk.value); });

        if(activeCats.length === 0) {
            alert("Tria almenys un tema!");
            return;
        }
        
        localStorage.setItem('eng_v12_cats', JSON.stringify(activeCats));
        goToScreen('menu');
    }

    function openReview() {
        const sel = document.getElementById('revCat');
        const filtered = vocab.filter(v => activeCats.includes(v.c));
        if(filtered.length === 0) return goToScreen('config');
        sel.innerHTML = filtered.map(cat => `<option value="${cat.c}">${cat.c}</option>`).join('');
        renderReview();
        goToScreen('review');
    }

    function renderReview() {
        const catName = document.getElementById('revCat').value;
        const practiceOn = document.getElementById('revPrac').checked;
        const listCont = document.getElementById('revList');
        const catData = vocab.find(v => v.c === catName);
        if(!catData) return;

        listCont.innerHTML = catData.w.map((item, i) => `
            <div class="review-row">
                <span>${item.k}</span>
                <button class="btn-mini" onclick="speak('${item.e}')">🔊</button>
                <input type="text" id="inp${i}" placeholder="${practiceOn ? '?' : ''}" value="${practiceOn ? '' : item.e}" ${practiceOn ? '' : 'disabled'} oninput="checkLive(this, '${item.e}', 'st${i}')" autocomplete="off">
                <div id="st${i}" style="width:20px"></div>
                <button class="btn-mini" onclick="alert('La paraula és: ${item.e}')">👁️</button>
            </div>
        `).join('');
    }

    function checkLive(el, cor, sid) {
        const st = document.getElementById(sid);
        if(el.value.toLowerCase().trim() === cor.toLowerCase()) { st.innerHTML="✅"; el.style.borderColor="green"; }
        else { st.innerHTML="❌"; el.style.borderColor="red"; }
    }

    function startGame(m) {
        mode = m; queue = []; curIdx = 0; mistakes = 0; matches = 0;
        const filtered = vocab.filter(v => activeCats.includes(v.c));
        if(filtered.length === 0) return goToScreen('config');

        filtered.forEach(cat => {
            let shuf = [...cat.w].sort(() => 0.5 - Math.random());
            queue.push(...shuf.slice(0, Math.min(limit, shuf.length)));
        });
        
        if(m !== 4) queue.sort(() => 0.5 - Math.random());
        goToScreen('game');
        if(m === 4) drawMatch(); else drawQuest();
    }

    function drawQuest() {
        if(curIdx >= queue.length) return endG();
        const item = queue[curIdx];
        const cont = document.getElementById('gCont');
        document.getElementById('prog').innerText = `${curIdx+1} / ${queue.length}`;
        document.getElementById('errs').innerText = `❌: ${mistakes}`;
        document.getElementById('fb').innerHTML = "";
        
        let h = `<h3>"${item.k}"</h3>`;
        if(mode === 1 || mode === 3) {
            h += `<input type="text" id="ai" autocomplete="off"><br><button class="primary" onclick="check(document.getElementById('ai').value)">Ok</button>`;
            if(mode === 3) speak(item.e);
        } else if(mode === 2) {
            let opts = [item.e];
            let allW = vocab.flatMap(v => v.w.map(word => word.e)); // Tots per tenir distractors
            while(opts.length < 4) {
                let r = allW[Math.floor(Math.random()*allW.length)];
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => 0.5 - Math.random()).forEach(o => h += `<button onclick="check('${o}')">${o}</button>`);
        }
        cont.innerHTML = h;
        if(document.getElementById('ai')) document.getElementById('ai').focus();
    }

    function check(u) {
        const it = queue[curIdx];
        if(u.toLowerCase().trim() === it.e.toLowerCase()) {
            document.getElementById('fb').innerHTML = "✅ CORRECTE!";
            setTimeout(() => { curIdx++; drawQuest(); }, 600);
        } else {
            mistakes++;
            document.getElementById('fb').innerHTML = `❌ Era: ${it.e}`;
            setTimeout(() => { curIdx++; drawQuest(); }, 1200);
        }
    }

    function drawMatch() {
        const cont = document.getElementById('gCont');
        let ca = queue.map(i => ({t:i.k, id:i.e})).sort(() => 0.5-Math.random());
        let en = queue.map(i => ({t:i.e, id:i.e})).sort(() => 0.5-Math.random());
        let h = '<div class="matching-container"><div>';
        ca.forEach(w => h += `<div class="match-card" onclick="selM(this,'${w.id}','c')">${w.t}</div>`);
        h += '</div><div>';
        en.forEach(w => h += `<div class="match-card" onclick="selM(this,'${w.id}','e')">${w.t}</div>`);
        h += '</div></div>';
        cont.innerHTML = h;
    }

    function selM(el, id, ty) {
        if(el.classList.contains('correct')) return;
        if(ty==='c') { if(s1) s1.el.classList.remove('selected'); s1={el,id}; }
        else { if(s2) s2.el.classList.remove('selected'); s2={el,id}; }
        el.classList.add('selected');
        if(s1 && s2) {
            if(s1.id === s2.id) {
                s1.el.classList.add('correct'); s2.el.classList.add('correct');
                matches++; s1=null; s2=null;
                if(matches === queue.length) setTimeout(endG, 600);
            } else {
                mistakes++; document.getElementById('errs').innerText = `❌: ${mistakes}`;
                let a=s1.el, b=s2.el;
                setTimeout(() => { a.classList.remove('selected'); b.classList.remove('selected'); }, 400);
                s1=null; s2=null;
            }
        }
    }

    function speak(t) { 
        const m = new SpeechSynthesisUtterance(t); 
        m.lang = 'en-GB'; window.speechSynthesis.speak(m); 
    }

    function endG() {
        const allowed = Math.floor(queue.length / 5);
        let won = (mistakes <= allowed);
        if(won) {
            let available = [];
            for(let i=1; i<=151; i++) if(!unlocked.includes(i)) available.push(i);
            if(available.length > 0) {
                let id = available[Math.floor(Math.random()*available.length)];
                unlocked.push(id);
                localStorage.setItem('eng_v12_unl', JSON.stringify(unlocked));
            }
        }
        document.getElementById('gCont').innerHTML = `<h2>${won ? '🌟 Molt Bé!' : '☁️ Torna-ho a provar'}</h2><p>Errors: ${mistakes}</p><button onclick="goToScreen('menu')">Tornar</button>`;
    }

    function openAlbum() { goToScreen('album'); drawAlb(); }
    function drawAlb() {
        const g = document.getElementById('gal'); g.innerHTML = "";
        document.getElementById('stats').innerText = `${unlocked.length} / 151 Cromos`;
        for(let i=1; i<=151; i++) {
            let isU = unlocked.includes(i);
            let d = document.createElement('div');
            d.className = `sticker ${isU?'':'locked'}`;
            if(isAdmin) d.onclick = () => { if(isU) unlocked.splice(unlocked.indexOf(i),1); else unlocked.push(i); drawAlb(); };
            if(isU) {
                let n = String(i).padStart(3, '0');
                d.innerHTML = `<img src="recompenses/${n}.png" onerror="this.parentElement.innerText='${n}'">`;
            } else { d.innerText = i; }
            g.appendChild(d);
        }
    }

    function enterAdmin() {
        if(prompt("Password:") === "Tercer2026") { isAdmin = true; document.getElementById('btnSaveAdmin').style.display = 'block'; drawAlb(); }
    }
    function exitAdmin() { isAdmin = false; localStorage.setItem('eng_v12_unl', JSON.stringify(unlocked)); document.getElementById('btnSaveAdmin').style.display = 'none'; drawAlb(); }
</script>
</body>
</html>
